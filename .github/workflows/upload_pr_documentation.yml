name: Upload PR Documentation

# Hugging Face doc-builder requires workflow_run to publish PR docs after the
# untrusted PR build finishes. Only runs when that build succeeded.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build PR Documentation"]
    types:
      - completed

permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@9ad2de8582b56c017cb530c1165116d40433f1c6  # main
    with:
      package_name: agents-course
      hub_base_path: https://moon-ci-docs.huggingface.co/learn
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}
